name: Build floatingpet APK
on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/pastel-natural-pet-20261028', 'release/he-xian-final', 'Fox' ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare FloatingPet signing key (optional)
        env:
          FLOATINGPET_KEYSTORE_BASE64: ${{ secrets.FLOATINGPET_KEYSTORE_BASE64 }}
          FLOATINGPET_KEYSTORE_PASSWORD: ${{ secrets.FLOATINGPET_KEYSTORE_PASSWORD }}
          FLOATINGPET_KEY_ALIAS: ${{ secrets.FLOATINGPET_KEY_ALIAS }}
          FLOATINGPET_KEY_PASSWORD: ${{ secrets.FLOATINGPET_KEY_PASSWORD }}
        run: |
          if [ -n "$FLOATINGPET_KEYSTORE_BASE64" ]; then
            echo "$FLOATINGPET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/floatingpet-signing.jks"
            echo "FLOATINGPET_KEYSTORE_PATH=$RUNNER_TEMP/floatingpet-signing.jks" >> "$GITHUB_ENV"
            echo "FLOATINGPET_KEYSTORE_PASSWORD=$FLOATINGPET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FLOATINGPET_KEY_ALIAS=$FLOATINGPET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FLOATINGPET_KEY_PASSWORD=$FLOATINGPET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No dedicated FloatingPet signing key configured; using temporary CI debug signing."
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/floatingpet.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floatingpet
          path: app/build/outputs/apk/debug/floatingpet.apk
          if-no-files-found: error
